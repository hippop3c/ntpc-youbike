<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8" />
<title>新北市 YouBike 2.0｜即時場站地圖</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
html,body{margin:0;height:100%;font-family:"Microsoft JhengHei",sans-serif}
#map{height:100vh}
.panel{
  position:absolute;top:10px;left:10px;z-index:1000;
  background:#fff;padding:10px;border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,.25)
}
.panel input,.panel select{width:200px;margin-bottom:6px}
</style>
</head>

<body>
<div class="panel">
  <input id="q" placeholder="搜尋場站名稱">
  <select id="district">
    <option value="">全部行政區</option>
  </select>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ========= API（可換成你自己的 Worker） ========= */
// const API = "https://green-boat-a984.hippop3c.workers.dev/";
const API = "https://data.ntpc.gov.tw/api/datasets/010e5b15-3823-4b20-b401-b1cf000550c5/json";

const map = L.map("map").setView([25.05,121.52],12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19
}).addTo(map);

let raw = [];
let markers = [];

function clearMarkers(){
  markers.forEach(m=>map.removeLayer(m));
  markers=[];
}

function render(){
  clearMarkers();
  const kw = q.value.trim();
  const dist = district.value;

  raw.forEach(r=>{
    if(dist && r.sarea !== dist) return;
    if(kw && !r.sna.includes(kw)) return;

    const lat = Number(r.latitude);
    const lng = Number(r.longitude);
    if(!lat || !lng) return;

    const rent = Number(r.available_rent_bikes) || 0;
    const ret  = Number(r.available_return_bikes) || 0;

    const color = rent===0 ? "#f59e0b" : "#22c55e";

    const m = L.circleMarker([lat,lng],{
      radius:8,
      color:"#333",
      fillColor:color,
      fillOpacity:0.9
    }).addTo(map);

    m.bindPopup(`
      <b>${r.sna}</b><br>
      行政區：${r.sarea}<br>
      可借：${rent}<br>
      可還：${ret}
    `);

    markers.push(m);
  });
}

fetch(API)
  .then(r=>r.json())
  .then(data=>{
    raw = data;

    const areas = [...new Set(raw.map(r=>r.sarea))]
      .filter(Boolean)
      .sort((a,b)=>a.localeCompare(b,"zh-Hant"));

    areas.forEach(a=>{
      const o=document.createElement("option");
      o.value=a;
      o.textContent=a;
      district.appendChild(o);
    });

    render();
  });

q.oninput = render;
district.onchange = render;
</script>
</body>
</html>

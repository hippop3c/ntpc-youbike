<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>新北市 YouBike 2.0｜即時場站地圖</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
html,body{margin:0;height:100%;background:#0b1020;color:#eaf0ff;font-family:sans-serif}
#map{height:100%}

/* split icon */
.icon-wrap{background:none;border:none}
.icon{
  width:36px;height:36px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:12px;font-weight:bold;color:#000;
  border:2px solid rgba(0,0,0,.4)
}
.icon.ok{background:#22c55e}
.icon.norent{background:#f59e0b}
.icon.noreturn{background:#ef4444}
.icon hr{width:70%;border:none;border-top:1px solid rgba(0,0,0,.4);margin:2px 0}
</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<div id="map"></div>

<script>
/* ====== 設定 ====== */
const WORKER_API = "https://green-boat-a984.hippop3c.workers.dev/youbike";
const AUTO_REFRESH_SEC = 60;

/* ====== 地圖 ====== */
const map = L.map("map").setView([25.06,121.52],12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19
}).addTo(map);

const layer = L.layerGroup().addTo(map);

/* ====== icon 顏色 ====== */
function iconClass(sbi,bemp){
  if(bemp===0) return "noreturn";
  if(sbi===0) return "norent";
  return "ok";
}

/* ====== 抓資料 ====== */
async function fetchData(){
  try{
    const res = await fetch(WORKER_API);
    const data = await res.json();

    layer.clearLayers();
    const bounds = [];

    data.forEach(d=>{
      const lat = Number(d.lat);
      const lng = Number(d.lng);
      if(!lat || !lng) return;

      const sbi = Number(d.sbi)||0;
      const bemp = Number(d.bemp)||0;
      const cls = iconClass(sbi,bemp);

      const icon = L.divIcon({
        className:"icon-wrap",
        html:`
          <div class="icon ${cls}">
            <div>${sbi}</div>
            <hr>
            <div>${bemp}</div>
          </div>
        `,
        iconSize:[36,36],
        iconAnchor:[18,18]
      });

      const m = L.marker([lat,lng],{icon}).addTo(layer);
      m.bindTooltip(d.sna,{direction:"top"});
      m.bindPopup(`
        <b>${d.sna}</b><br>
        站號：${d.sno}<br>
        行政區：${d.sarea}<br>
        可借：${sbi}<br>
        可還：${bemp}<br>
        車柱：${d.tot}
      `);

      bounds.push([lat,lng]);
    });

    if(bounds.length){
      map.fitBounds(bounds,{padding:[20,20]});
    }

    console.log("YouBike stations:", data.length);
  }catch(e){
    console.error("抓取失敗",e);
    alert("資料抓取失敗，請確認 Worker 是否正常");
  }
}

/* ====== 初始化 ====== */
fetchData();
setInterval(fetchData, AUTO_REFRESH_SEC*1000);
</script>

</body>
</html>

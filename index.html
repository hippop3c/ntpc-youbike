<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>新北市 YouBike 2.0｜即時場站地圖</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    :root{
      --bg:#0b1020; --card:#111730; --muted:#9aa3b2; --text:#eaf0ff;
      --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;
      background:var(--bg); color:var(--text);
    }
    header{
      position:sticky; top:0; z-index:10;
      backdrop-filter:saturate(150%) blur(8px);
      background:linear-gradient(180deg, rgba(11,16,32,.9), rgba(11,16,32,.6));
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .wrap{max-width:1200px;margin:0 auto;padding:16px}
    h1{font-size:20px;margin:0 0 6px 0}
    .controls{
      display:grid; gap:8px;
      grid-template-columns:1fr 160px 160px 160px;
    }
    .controls > *{
      background:var(--card); color:var(--text);
      border:1px solid rgba(255,255,255,.08);
      border-radius:12px; padding:10px 12px;
    }
    .controls input,.controls select{
      width:100%; background:transparent; color:inherit;
      border:none; outline:none; font-size:14px;
    }
    .meta{
      display:flex; flex-wrap:wrap; gap:8px; align-items:center;
      font-size:12px; color:var(--muted); margin-top:6px;
    }
    .pill{
      padding:4px 8px; border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.06);
    }
    .pill.button{cursor:pointer}
    #map{
      height:60vh; width:100%;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.08);
      background:#0a0f1f;
      margin:12px 0 16px;
    }
    .grid{
      margin-top:4px;
      background:var(--card);
      border-radius:16px;
      border:1px solid rgba(255,255,255,.08);
      overflow:hidden;
    }
    table{width:100%; border-collapse:collapse; font-size:14px}
    thead{background:rgba(255,255,255,.04)}
    th,td{
      padding:8px 10px;
      text-align:left;
      border-bottom:1px solid rgba(255,255,255,.06);
      white-space:nowrap;
    }
    tr:hover td{background:rgba(255,255,255,.03);}
    .footer{font-size:12px; color:var(--muted); padding:10px 12px}
    .hidden{display:none}
    @media(max-width:900px){
      .controls{grid-template-columns:1fr 1fr;}
    }

    /* split 圓 icon */
    .leaflet-marker-icon.icon-wrap{
      background:transparent!important;
      border:none!important;
    }
    .icon-split{
      width:40px;height:40px;border-radius:50%;
      border:2px solid rgba(0,0,0,.35);
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      font-weight:800;color:#0b1020;line-height:1;
      box-shadow:0 1px 2px rgba(0,0,0,.25);
    }
    .icon-split .top{font-size:12px;}
    .icon-split .bottom{font-size:12px;}
    .icon-split .divider{
      width:70%;border-top:1.5px solid rgba(0,0,0,.35);margin:2px 0;
    }
    .icon-split.ok{background:var(--ok);}
    .icon-split.norent{background:var(--warn);}
    .icon-split.noreturn{background:var(--bad);}
  </style>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
<header>
  <div class="wrap">
    <h1>新北市 YouBike 2.0｜即時場站地圖</h1>
    <div class="controls">
      <label><input id="q" placeholder="搜尋場站名稱 / 站點代號 / 地址…"></label>
      <label><select id="district"><option value="">全部行政區</option></select></label>
      <label><select id="status">
        <option value="">全部狀態</option>
        <option value="open">營運中</option>
        <option value="closed">暫停營運</option>
      </select></label>
      <label><select id="interval">
        <option value="30">每 30 秒自動更新</option>
        <option value="60" selected>每 60 秒自動更新</option>
        <option value="120">每 2 分鐘自動更新</option>
        <option value="0">手動</option>
      </select></label>
    </div>
    <div class="meta">
      <span id="lastUpdate" class="pill">最後更新：—</span>
      <span id="count" class="pill">筆數：—</span>
      <button id="manualBtn" class="pill button">↻ 立即更新</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="map"></div>

  <div class="grid">
    <table>
      <thead>
        <tr>
          <th>站點代號</th>
          <th>場站</th>
          <th>行政區</th>
          <th>可借</th>
          <th>可還</th>
          <th>車柱</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="empty" class="footer hidden">找不到符合條件的場站。</div>
  </div>
</main>

<script>
/* === 設定 === */
const DATA_URL = "https://green-boat-a984.hippop3c.workers.dev/";
const el = id => document.getElementById(id);

const tbody = el("tbody");
const q = el("q");
const district = el("district");
const statusSel = el("status");
const intervalSel = el("interval");
const manualBtn = el("manualBtn");
const lastUpdate = el("lastUpdate");
const count = el("count");

let raw = [];
let view = [];
let timer = null;

/* === 地圖 === */
const map = L.map("map").setView([25.05,121.52],12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);
const markerLayer = L.layerGroup().addTo(map);

function cls(sbi,bemp){
  if(bemp===0) return "noreturn";
  if(sbi===0) return "norent";
  return "ok";
}

/* === 渲染 === */
function render(){
  const kw = q.value.trim().toLowerCase();
  const dist = district.value;
  const st = statusSel.value;

  view = raw.filter(r=>{
    if(dist && r.sarea!==dist) return false;
    if(st==="open" && r.act!=="1") return false;
    if(st==="closed" && r.act==="1") return false;
    if(!kw) return true;
    return `${r.sno}|${r.sna}|${r.ar}`.toLowerCase().includes(kw);
  });

  tbody.innerHTML="";
  markerLayer.clearLayers();

  view.forEach(r=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${r.sno}</td>
      <td>${r.sna}</td>
      <td>${r.sarea}</td>
      <td>${r.sbi}</td>
      <td>${r.bemp}</td>
      <td>${r.tot}</td>
    `;
    tbody.appendChild(tr);

    const html=`
      <div class="icon-split ${cls(r.sbi,r.bemp)}">
        <div class="top">${r.sbi}</div>
        <div class="divider"></div>
        <div class="bottom">${r.bemp}</div>
      </div>`;
    const icon=L.divIcon({className:"icon-wrap",html,iconSize:[40,40],iconAnchor:[20,20]});
    const m=L.marker([r.lat,r.lng],{icon}).addTo(markerLayer);
    m.bindPopup(`
      <b>${r.sna}</b><br>
      行政區：${r.sarea}<br>
      可借：${r.sbi}<br>
      可還：${r.bemp}<br>
      車柱：${r.tot}
    `);
  });

  count.textContent=`筆數：${view.length}`;
  el("empty").classList.toggle("hidden",view.length>0);
}

/* === 抓資料 === */
async function fetchData(){
  const res=await fetch(DATA_URL,{cache:"no-store"});
  raw=await res.json();

  if(district.options.length===1){
    [...new Set(raw.map(r=>r.sarea))].sort().forEach(a=>{
      const o=document.createElement("option");
      o.value=a;o.textContent=a;
      district.appendChild(o);
    });
  }
  lastUpdate.textContent="最後更新："+new Date().toLocaleString("zh-TW",{hour12:false});
  render();
}

function setTimer(){
  if(timer) clearInterval(timer);
  const sec=Number(intervalSel.value);
  if(sec>0) timer=setInterval(fetchData,sec*1000);
}

q.oninput=render;
district.onchange=render;
statusSel.onchange=render;
intervalSel.onchange=setTimer;
manualBtn.onclick=fetchData;

fetchData();
setTimer();
</script>
</body>
</html>

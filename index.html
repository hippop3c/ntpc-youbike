<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YouBike 2.0 新北 </title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Microsoft JhengHei",sans-serif;background:#0b1020;color:#fff;}
#map{height:70vh;width:100%;}
.panel{padding:10px;background:#111730;}
input,select,button{padding:6px;border-radius:6px;border:none;margin-right:6px;}
.icon-wrap{background:transparent!important;border:none!important;}
.icon{width:38px;height:38px;border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center;font-weight:700;}
.ok{background:#22c55e;} .norent{background:#f59e0b;} .noreturn{background:#ef4444;}
.icon div{line-height:1;font-size:12px;}
</style>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
<div class="panel">
  <b>搜尋：</b><input id="q" placeholder="站名 / 站號 / 地址">
  <b>行政區：</b><select id="district"><option value="">全部</option></select>
  <b>狀態：</b><select id="status">
    <option value="">全部</option>
    <option value="open">營運中</option>
    <option value="closed">暫停</option>
  </select>
  <b>更新：</b><select id="refresh">
    <option value="30" selected>30 秒</option>
    <option value="60">60 秒</option>
    <option value="0">手動</option>
  </select>
  <button id="reload">立即更新</button>
  <span id="info"></span>
</div>

<div id="map"></div>

<script>
// ★★★ 使用你的 Worker ★★★
const BASE = "https://green-boat-a984.hippop3c.workers.dev";

const el = id=>document.getElementById(id);
const q=el("q"), district=el("district"), statusSel=el("status"), refreshSel=el("refresh"), info=el("info");

let raw=[], view=[];
let timer=null;

const map=L.map("map").setView([25.06,121.5],12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);
const layer=L.layerGroup().addTo(map);

function cls(s,b){
  if(b==0) return "noreturn";
  if(s==0) return "norent";
  return "ok";
}

function render(){
  const kw=q.value.trim().toLowerCase(), dist=district.value, st=statusSel.value;
  view=raw.filter(r=>{
    if(dist && r.sarea!==dist) return false;
    if(st==="open" && r.act!=="1") return false;
    if(st==="closed" && r.act==="1") return false;
    if(!kw) return true;
    return (r.sno+r.sna+(r.ar||"")).toLowerCase().includes(kw);
  });

  layer.clearLayers();
  const pts=[];

  view.forEach(r=>{
    const lat=Number(r.lat), lng=Number(r.lng);
    if(!lat||!lng) return;
    const s=r.sbi, b=r.bemp;

    const html=`<div class="icon ${cls(s,b)}"><div>${s}</div><div>${b}</div></div>`;
    const icon=L.divIcon({className:"icon-wrap",html,iconSize:[38,38],iconAnchor:[19,19]});

    L.marker([lat,lng],{icon})
      .bindPopup(`
        <b>${r.sna}</b><br>
        站號：${r.sno}<br>
        行政區：${r.sarea}<br>
        可借：${s}｜可還：${b}<br>
        地址：${r.ar}
      `)
      .bindTooltip(r.sna)
      .addTo(layer);

    pts.push([lat,lng]);
  });

  if(pts.length) map.fitBounds(pts,{padding:[20,20]});
  info.textContent=`筆數：${view.length}`;
}

async function load(){
  try{
    info.textContent="讀取中...";
    const url = `${BASE}?page=0&size=20000`;
    const res = await fetch(url);
    const j = await res.json();
    raw = Array.isArray(j) ? j : j.data || [];

    // 行政區建立一次
    district.innerHTML='<option value="">全部</option>';
    [...new Set(raw.map(r=>r.sarea))]
      .sort((a,b)=>a.localeCompare(b,"zh-Hant"))
      .forEach(a=>{
        const o=document.createElement("option");
        o.value=a; o.textContent=a;
        district.appendChild(o);
      });

    render();
    info.textContent="更新：" + new Date().toLocaleTimeString("zh-TW",{hour12:false});
  }catch(e){
    info.textContent="抓取失敗";
    alert("讀取失敗："+e);
  }
}

function auto(){
  if(timer) clearInterval(timer);
  const sec=Number(refreshSel.value);
  if(sec>0) timer=setInterval(load, sec*1000);
}

q.addEventListener("input",render);
district.addEventListener("change",render);
statusSel.addEventListener("change",render);
refreshSel.addEventListener("change",auto);
el("reload").addEventListener("click",load);

load();
auto();
</script>

</body>
</html>

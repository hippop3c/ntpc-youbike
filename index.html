<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YouBike 2.0 新北市即時地圖</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Microsoft JhengHei",sans-serif;background:#0b1020;color:#fff;}
#map{height:80vh;width:100%;}
.panel{padding:12px;background:#111730;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid #2d3748;}
input,select,button{padding:8px 12px;border-radius:6px;border:1px solid #334155;background:#1e293b;color:#fff;outline:none;}
input:focus{border-color:#3b82f6;}
button{background:#3b82f6;cursor:pointer;font-weight:bold;border:none;}
button:hover{background:#2563eb;}
.icon-wrap{background:transparent!important;border:none!important;}
.icon{width:40px;height:40px;border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center;font-weight:700;box-shadow:0 3px 6px rgba(0,0,0,0.4);border:2px solid rgba(255,255,255,0.2);}
.ok{background:#22c55e;} .norent{background:#f59e0b;} .noreturn{background:#ef4444;}
.icon div{line-height:1.2;font-size:13px;}
#info{font-size:14px;color:#94a3b8;margin-left:auto;}
/* 彈窗樣式優化 */
.leaflet-popup-content-wrapper {background: #1e293b; color: #fff; border-radius: 8px;}
.leaflet-popup-tip {background: #1e293b;}
</style>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
<div class="panel">
  <input id="q" placeholder="搜尋站名或地址...">
  <select id="district"><option value="">所有行政區</option></select>
  <select id="status">
    <option value="">所有狀態</option>
    <option value="open">營運中</option>
    <option value="closed">暫停營運</option>
  </select>
  <select id="refresh">
    <option value="30" selected>30 秒更新</option>
    <option value="60">60 秒更新</option>
    <option value="0">手動更新</option>
  </select>
  <button id="reload">立即重整</button>
  <span id="info">讀取資料中...</span>
</div>

<div id="map"></div>

<script>
// 使用您的 Worker API
const API_URL = "https://green-boat-a984.hippop3c.workers.dev";

const el = id => document.getElementById(id);
const q = el("q"), district = el("district"), statusSel = el("status"), refreshSel = el("refresh"), info = el("info");

let rawData = [], timer = null, isFirstLoad = true;

// 初始化地圖 (中心設在新北市政府)
const map = L.map("map").setView([25.012, 121.465], 13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '© OpenStreetMap contributors'
}).addTo(map);
const markerLayer = L.layerGroup().addTo(map);

// 判斷顏色邏輯
function getStatusClass(sbi, bemp) {
  if (bemp <= 0) return "noreturn"; // 無位可還
  if (sbi <= 0) return "norent";   // 無車可借
  return "ok";
}

function render() {
  const kw = q.value.trim().toLowerCase();
  const dist = district.value;
  const st = statusSel.value;

  const filtered = rawData.filter(r => {
    if (dist && r.sarea !== dist) return false;
    if (st === "open" && r.act !== "1") return false;
    if (st === "closed" && r.act === "1") return false;
    if (!kw) return true;
    return (r.sna + (r.ar || "")).toLowerCase().includes(kw);
  });

  markerLayer.clearLayers();
  const bounds = [];

  filtered.forEach(r => {
    const lat = parseFloat(r.lat), lng = parseFloat(r.lng);
    if (isNaN(lat) || isNaN(lng)) return;

    // --- 關鍵修正：確保數值正確解析，防止 NaN ---
    // 優先抓取 sbi/bemp，若無則抓取備用欄位名，最後給予 0
    const sbi = parseInt(r.sbi ?? r.available_rent_bikes ?? 0); 
    const bemp = parseInt(r.bemp ?? r.avail_return_number ?? 0);
    
    const displayName = r.sna.replace("YouBike2.0_", "");
    const statusClass = getStatusClass(sbi, bemp);

    const html = `<div class="icon ${statusClass}"><div>${sbi}</div><div>${bemp}</div></div>`;
    const icon = L.divIcon({ className: "icon-wrap", html, iconSize: [40, 40], iconAnchor: [20, 20] });

    L.marker([lat, lng], { icon })
      .bindPopup(`
        <div style="color:#fff">
          <strong style="font-size:16px;">${displayName}</strong><br>
          <span style="color:#94a3b8; font-size:12px;">${r.sarea} | 站號: ${r.sno}</span>
          <hr style="border:0.5px solid #334155; margin:8px 0;">
          <div style="display:flex; justify-content:space-between;">
            <span>可借車輛: <strong>${sbi}</strong></span>
            <span>可還空位: <strong>${bemp}</strong></span>
          </div>
          <div style="margin-top:5px; font-size:12px; color:#cbd5e1;">地址: ${r.ar}</div>
        </div>
      `)
      .addTo(markerLayer);

    bounds.push([lat, lng]);
  });

  // 僅在初次載入時縮放至所有點位
  if (isFirstLoad && bounds.length > 0) {
    map.fitBounds(bounds, { padding: [30, 30] });
    isFirstLoad = false;
  }

  info.textContent = `站點：${filtered.length} | 最後更新：${new Date().toLocaleTimeString('zh-TW', { hour12: false })}`;
}

async function fetchData() {
  try {
    info.textContent = "更新中...";
    const response = await fetch(`${API_URL}?t=${Date.now()}`);
    const json = await response.json();
    
    // 支援多種 API 格式
    rawData = Array.isArray(json) ? json : (json.data || json.result?.records || []);

    if (rawData.length === 0) {
      info.textContent = "抓取成功，但資料內容為空";
      return;
    }

    // 初始化行政區選單 (只做一次)
    if (district.options.length <= 1) {
      const areas = [...new Set(rawData.map(r => r.sarea))].sort((a, b) => a.localeCompare(b, "zh-Hant"));
      areas.forEach(a => {
        const opt = document.createElement("option");
        opt.value = opt.textContent = a;
        district.appendChild(opt);
      });
    }

    render();
  } catch (error) {
    console.error("Fetch Error:", error);
    info.textContent = "資料讀取失敗，請確認 API 狀態";
  }
}

function startTimer() {
  if (timer) clearInterval(timer);
  const sec = parseInt(refreshSel.value);
  if (sec > 0) timer = setInterval(fetchData, sec * 1000);
}

// 事件監聽
q.addEventListener("input", render);
district.addEventListener("change", render);
statusSel.addEventListener("change", render);
refreshSel.addEventListener("change", startTimer);
el("reload").addEventListener("click", () => {
  isFirstLoad = true; // 點擊重整時重新定位縮放
  fetchData();
});

// 啟動程式
fetchData();
startTimer();
</script>

</body>
</html>
